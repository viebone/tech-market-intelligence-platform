<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Pipeline Visibility{% endblock %}</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand">Pipeline Visibility</div>
      <nav>
        <a href="/admin/" class="{{ 'active' if active_page == 'overview' else '' }}">Overview</a>
        <a href="/admin/postings" class="{{ 'active' if active_page == 'postings' else '' }}">Postings</a>
        <a href="/admin/runs" class="{{ 'active' if active_page == 'runs' else '' }}">Ingestion Runs</a>
        <a href="/admin/employment-events" class="{{ 'active' if active_page == 'employment_events' else '' }}">Employment Events</a>
        <a href="/admin/licensing" class="{{ 'active' if active_page == 'licensing' else '' }}">Sources & Licensing</a>
        <a href="/admin/market-observations" class="{{ 'active' if active_page == 'market_observations' else '' }}">Market Observations</a>
        <a href="/admin/skill-associations" class="{{ 'active' if active_page == 'skill_associations' else '' }}">Skill Associations</a>
        <a href="/admin/scrape-runs" class="{{ 'active' if active_page == 'scrape_runs' else '' }}">Scraped Source Runs</a>
        <a href="/admin/taxonomy-health" class="{{ 'active' if active_page == 'taxonomy_health' else '' }}">Taxonomy Health</a>
      </nav>
      <form class="logout-form" method="post" action="/admin/logout">
        <button type="submit" class="btn-ghost">Log out</button>
      </form>
    </aside>
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
