<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect {{ client_name }} — Tech Market Intelligence Platform</title>
  <style>
    /* Tokens match design/visual-design.md v1.7 exactly (Colour System,
       Component Aesthetics — OAuth consent screen). No Tailwind build step
       exists on the backend, so these are the same hex values, hand-written
       — same approach admin_templates/admin.css already uses for this
       codebase's other server-rendered surface. */
    body {
      margin: 0;
      background: #111827; /* gray-900 */
      color: #f3f4f6; /* gray-100 */
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1f2937; /* gray-800 */
      border: 1px solid #374151; /* gray-700 */
      border-radius: 8px;
      padding: 24px;
    }
    .requester {
      font-size: 14px;
      font-weight: 500;
      margin: 0 0 16px;
    }
    ul.scopes {
      list-style: none;
      margin: 0 0 20px;
      padding: 0;
      font-size: 14px;
      color: #d1d5db; /* gray-300 */
    }
    ul.scopes li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 0;
    }
    ul.scopes li::before {
      content: "\2713";
      color: #9ca3af; /* gray-400 */
    }
    button, .cancel-link {
      width: 100%;
      display: block;
      box-sizing: border-box;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      padding: 8px 16px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    button {
      background: #4f46e5; /* indigo-600 */
      color: white;
      border: none;
      margin-bottom: 8px;
    }
    button:hover { background: #4338ca; /* indigo-700 */ }
    .cancel-link {
      background: transparent;
      color: #9ca3af; /* gray-400 */
      border: none;
    }
    .cancel-link:hover { color: #e5e7eb; /* gray-200 */ }
  </style>
</head>
<body>
  <div class="card">
    <p class="requester">{{ client_name }} is requesting access</p>
    <ul class="scopes">
      {% for scope in scopes %}
        <li>{{ scope.label }}</li>
      {% endfor %}
    </ul>
    <form method="post" action="/mcp/oauth/authorize">
      <input type="hidden" name="client_id" value="{{ client_id }}">
      <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
      <input type="hidden" name="state" value="{{ state }}">
      <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
      <input type="hidden" name="requested_scope" value="{{ requested_scope }}">
      <button type="submit" name="action" value="allow">Allow</button>
      <button type="submit" name="action" value="cancel" class="cancel-link" style="background:transparent;">Cancel</button>
    </form>
  </div>
</body>
</html>
